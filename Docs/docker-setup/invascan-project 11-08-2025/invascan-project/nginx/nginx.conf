upstream webreporting_backend {
    server webreporting_container:80;
}

upstream api_backend {
    server invascanapi_container:80;
}

upstream sync_backend {
    server datasync_container:8081;
}

server {
    listen 80;
    server_name localhost;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Main web interface - Dashboard
    location / {
        proxy_pass http://webreporting_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Enable WebSocket support if needed
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Disable caching for dynamic content
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # API endpoints - Route to INVASCAN API
    location /api/ {
        proxy_pass http://api_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # API specific settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # CORS headers for API
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization";
    }

    # Data sync service endpoints
    location /sync/ {
        proxy_pass http://sync_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Sync service specific settings
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Health check endpoints
    location /health {
        access_log off;
        return 200 "INVASCAN system is running\nTimestamp: $time_iso8601\n";
        add_header Content-Type text/plain;
    }

    # Individual service health checks
    location /health/api {
        access_log off;
        proxy_pass http://api_backend/wwwroot/status.json;
        proxy_set_header Host $host;
    }

    location /health/sync {
        access_log off;
        proxy_pass http://sync_backend/api/status.json;
        proxy_set_header Host $host;
    }

    location /health/web {
        access_log off;
        proxy_pass http://webreporting_backend/api/status.json;
        proxy_set_header Host $host;
    }

    # Static assets with proper caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://webreporting_backend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Pragma "public";
    }

    # Handle OPTIONS requests for CORS
    location @options {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization";
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /404.html {
        return 404 "Page not found";
        add_header Content-Type text/plain;
    }
    
    location = /50x.html {
        return 500 "Internal server error";
        add_header Content-Type text/plain;
    }

    # Logging
    access_log /var/log/nginx/invascan_access.log;
    error_log /var/log/nginx/invascan_error.log warn;
}