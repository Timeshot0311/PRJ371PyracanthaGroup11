name: invascan

networks:
  INVASCAN:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1 #added the gateway so all network know and can communicate with one another.

services:
  # Microsoft SQL Server Container
  mssql_container:
    image: mcr.microsoft.com/mssql/server:latest
    logging: # Added logging options and restricting log file growth to only 10MB with rotation to 3 files
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    container_name: mssql_container
    environment:
      - ACCEPT_EULA="Y"
      - SA_PASSWORD=G9e@7I4RiCT#
      - TZ=Africa/Johannesburg # Adding SA timezone so date and time are correct.
    ports:
      - "1406:1433"
    networks:
      INVASCAN:
        ipv4_address: 172.20.0.2
    restart: unless-stopped
    volumes:
      - mssql_data:/var/opt/mssql
      - ./01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - /etc/localtime:/etc/localtime:ro # Adding SA timezone so date and time are correct.
      - /etc/timezone:/etc/timezone:ro # Adding SA timezone so date and time are correct.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/1433'"]
      # test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P G9e@7I4RiCT# -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # INVASCAN API Container
  invascanapi_container:
    image: invascan/dev:invascanapi_v3.36
    logging: # Added logging options and restricting log file growth to only 10MB with rotation to 3 files
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    container_name: invascanapi_container
    ports:
      - "8080:80"
    networks:
      INVASCAN:
        ipv4_address: 172.20.0.3
    depends_on:
      mssql_container:
        condition: service_healthy
    environment:
      - DATABASE_URL=mssql+pyodbc://sa:G9e@7I4RiCT#@mssql_container:1433/InvascanDb?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
      - TZ=Africa/Johannesburg # Adding SA timezone so date and time are correct.
    volumes:
      - /etc/localtime:/etc/localtime:ro # Adding SA timezone so date and time are correct.
      - /etc/timezone:/etc/timezone:ro # Adding SA timezone so date and time are correct.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/openapi.json || exit 1"]
      # test: ["CMD-SHELL", "curl -f http://localhost:80/wwwroot/status.json || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

    # Data Sync Container
    datasync_container:
      image: invascan/dev:datasync_v1.2
      logging: # Added logging options and restricting log file growth to only 10MB with rotation to 3 files
        driver: "json-file"
        options:
          max-size: "10m"
          max-file: "3"
      container_name: datasync_container
      ports:
        - "8081:8081"
      networks:
        INVASCAN:
          ipv4_address: 172.20.0.4
      depends_on:
        mssql_container:
          condition: service_healthy
        invascanapi_container:
          condition: service_healthy
      environment:
        - DB_CONNECTION_STRING=Server=mssql_container,1433;Database=InvascanDb;User Id=sa;Password=G9e@7I4RiCT#;Encrypt=false;TrustServerCertificate=true;
        - API_URL=http://invascanapi_container:80
      restart: unless-stopped
      healthcheck:
        test: ["CMD-SHELL", "python3 -c 'import requests; requests.get(\"http://localhost:8081\")' || exit 1"]
        interval: 30s
        timeout: 10s
        retries: 3

  # # Enhanced Web Reporting Container
  # webreporting_container:
  #   image: invascan/invascanweb:latest
  #   logging: # Added logging options and restricting log file growth to only 10MB with rotation to 3 files
  #     driver: "json-file"
  #     options:
  #       max-size: "10m"
  #       max-file: "3"
  #   # build:
  #   #   context: .
  #   #   dockerfile: Dockerfile.webreporting
  #   container_name: webreporting_container
  #   ports:
  #     - "8082:80"  # Changed port to avoid conflict
  #   networks:
  #     INVASCAN:
  #       ipv4_address: 172.20.0.5
  #   depends_on:
  #     invascanapi_container:
  #       condition: service_healthy
  #     datasync_container:
  #       condition: service_healthy
  #   environment:
  #     - API_ENDPOINT=http://invascanapi_container:80
  #     - SYNC_ENDPOINT=http://datasync_container:8081
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

  # Nginx Reverse Proxy Container 
  nginx_proxy:
    image: nginx:alpine
    logging: # Added logging options and restricting log file growth to only 10MB with rotation to 3 files
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    container_name: nginx_proxy
    ports:
      - "8000:80"   # Main entry point for the application
    networks:
      INVASCAN:
        ipv4_address: 172.20.0.6
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      # webreporting_container:
      #   condition: service_healthy
      invascanapi_container:
        condition: service_healthy
      # datasync_container:
      #   condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mssql_data:
    driver: local