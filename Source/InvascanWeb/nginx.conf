# nginx/nginx.conf  (mounted at /etc/nginx/conf.d/default.conf)
upstream api_backend {
    server invascanapi_container:80;
}

# Reflect the caller's Origin (restrict if you prefer)
map $http_origin $cors_origin {
    default $http_origin;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 500M;

    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    # ---- API ---- (preserve /api prefix)
    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        proxy_pass http://api_backend;  # no trailing slash
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        send_timeout          300s;

        proxy_request_buffering off;
        proxy_buffering off;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
        add_header Access-Control-Expose-Headers "*" always;
        add_header Vary "Origin" always;
    }

    # ---- Static images served by API (when API returns /images/...) ----
    location /images/ {
        proxy_pass http://api_backend/images/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Vary "Origin" always;
    }

    location /openapi.json {
        proxy_pass http://api_backend/openapi.json;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Vary "Origin" always;
    }

    location /docs {
        proxy_pass http://api_backend/docs;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Vary "Origin" always;
    }

    location / { return 301 /docs; }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Vary "Origin" always;
    }
}
