# nginx/nginx.conf  (mounted at /etc/nginx/conf.d/default.conf)

upstream api_backend {
    server invascanapi_container:80;
}

# Reflect the caller's Origin (restrict if you want)
map $http_origin $cors_origin {
    default $http_origin;
}

server {
    listen 80;
    server_name localhost;

    # accept big base64 JSON
    client_max_body_size 500M;

    # -------- Health --------
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    # -------- API (preserve /api prefix) --------
    location /api/ {
        # Preflight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        # Forward to API without stripping /api
        proxy_pass http://api_backend;  # <— no trailing slash (keeps /api/engine/investigate)
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Larger/longer requests
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        send_timeout          300s;

        # Large JSON bodies: avoid buffering if needed
        proxy_request_buffering off;
        proxy_buffering off;

        # CORS on ALL responses (success or error)
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
        add_header Access-Control-Expose-Headers "*" always;
        add_header Vary "Origin" always;
    }

    # Swagger/OpenAPI (optional CORS)
    location /openapi.json {
        proxy_pass http://api_backend/openapi.json;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Vary "Origin" always;
    }

    location /docs {
        proxy_pass http://api_backend/docs;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Vary "Origin" always;
    }

    # Default
    location / { return 301 /docs; }

    # Error pages (still include CORS)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Vary "Origin" always;
    }
}
